name: Scheduled Fitness Telemetry Sync

on:
  schedule:
    # Run every 2 hours (cron format: minute hour day-of-month month day-of-week)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to manually trigger the sync from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated sync pipeline
      env:
        # Shared cloud database (Supabase Postgres). All synced telemetry and
        # the OAuth tokens live here so every run is stateless.
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Strava refreshes itself from the refresh token stored in the DB.
        STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
        STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        # Google token minted once locally via `python authorize.py`. Lets the
        # job sync Google Fit + FitNotes (Drive) and publish the Gemini profile
        # with no interactive browser flow. Optional if the token is already in
        # the shared database.
        GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      run: |
        python sync_all.py
