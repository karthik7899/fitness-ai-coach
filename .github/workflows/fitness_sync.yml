name: Scheduled Fitness Telemetry Sync

on:
  schedule:
    # Run every 2 hours (cron format: minute hour day-of-month month day-of-week)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to manually trigger the sync from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated sync pipeline
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
        STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      run: |
        python sync_all.py
