name: Android

# Builds an installable APK, so getting the app onto a phone needs no computer:
# download the artifact from this run on the phone itself and open it.
#
# It is also the only place :app is compiled at all. The core module builds
# anywhere; the Android module needs an SDK, and this is where one lives.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "fixtures/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle.kts only includes :app when an SDK is present, so that
      # :core stays buildable on a machine without one. Make that explicit here
      # rather than depending on the runner's environment staying as it is.
      - name: Point the build at the SDK
        run: |
          test -n "$ANDROID_HOME" || { echo "No Android SDK on this runner." >&2; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # The logic lives here and needs no SDK, so run it first: a failure in
      # core is a failure about the numbers, which is worth seeing on its own.
      - name: Test core
        working-directory: android
        run: ./gradlew :core:test

      - name: Build the app
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore
