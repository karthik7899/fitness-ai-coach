[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-api"
version = "0.1.0"
description = "Personal training data warehouse and coaching agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10",
    "sse-starlette>=2.1",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]

# psycopg needs libpq. The bundled build is the easy default, but it ships only
# manylinux wheels, which Termux (Bionic libc) cannot use — there, install the
# `system` extra and let it link against Termux's own postgresql package.
[project.optional-dependencies]
binary = ["psycopg[binary]>=3.2"]
system = ["psycopg>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# Without this, setuptools' flat-layout discovery refuses to build: it finds both
# `app` and `alembic` at the top level. Only `app` is library code.
[tool.setuptools]
packages = ["app"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 fires on FastAPI's Depends() default-argument idiom, which is correct here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest sets DATABASE_URL before the app imports that build the settings
# singleton, so its imports cannot be hoisted to the top of the file.
"tests/conftest.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
