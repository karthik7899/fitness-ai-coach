services:
  db:
    image: postgres:16-alpine
    container_name: aura-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    # Bound to loopback only: this is a single-user local tool.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aura-pgdata:
