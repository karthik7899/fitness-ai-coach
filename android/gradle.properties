org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Required: every Compose and AndroidX artifact fails the AAR metadata check
# without it. Not a preference — the build refuses to assemble.
android.useAndroidX=true
# Each module's R class holds only its own resources, so a resource cannot be
# resolved by accident through a dependency.
android.nonTransitiveRClass=true
